spring.application.name=kart-delivery

# env path setup
spring.config.import=optional:file:../.env[.properties]

# Supabase connection setup
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USER}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# flyway migration setup
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=kart_delivery
spring.flyway.default-schema=kart_delivery
spring.flyway.create-schemas=true

# server setup
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.default_schema=kart_delivery
server.port=8084


# actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-components=always
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true

# external service call
catalog.service.base-url=http://localhost:8082
order.service.base-url=http://localhost:8083

# kafka server
spring.kafka.bootstrap-servers=localhost:9092

# kafka consumer
spring.kafka.consumer.group-id=kart-delivery
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.value.default.type=com.kart.order.kafka.event.OrderEvent
spring.kafka.consumer.properties.spring.json.trusted.packages=com.kart.order.kafka.event